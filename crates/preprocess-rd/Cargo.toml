[package.metadata.cargo-machete]
ignored = ["exn"]

[[bin]]
doctest = false
name = "preprocess-rd"
path = "src/bin/preprocess-rd/main.rs"
test = false

[[bin]]
doctest = false
name = "preprocess-rd-segreg"
path = "src/bin/preprocess-rd-segreg/main.rs"
